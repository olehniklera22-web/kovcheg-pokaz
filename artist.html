<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Артист — Театральный ковчег в Дубраве</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Fira+Sans+Extra+Condensed:wght@500;600;700;800&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=6">
<link rel="stylesheet" href="assets/collage.css?v=2">
<link rel="stylesheet" href="assets/main.css?v=27">
<link rel="stylesheet" href="assets/pages.css?v=3">
</head>
<body data-page="troupe">
<div id="site-header"></div>
<main id="main">
  <section class="ar-hero">
    <div class="wrap">
      <div class="pic"><img id="ar-img" alt=""></div>
      <div class="tx">
        <a class="back" id="ar-back" href="truppa.html">← Вся труппа</a>
        <span class="eyebrow" id="ar-k">Труппа</span>
        <h1 class="h-xl" id="ar-t"></h1>
        <p class="role" id="ar-role"></p>
        <dl class="facts" id="ar-facts"></dl>
      </div>
    </div>
  </section>

  <section class="sp-sec" id="roles-w">
    <div class="wrap">
      <div class="sp-h"><h2 class="h-m">Роли в спектаклях</h2></div>
      <ul class="ar-roles" id="ar-roles"></ul>
    </div>
  </section>

  <section class="sp-sec" id="soon-w">
    <div class="wrap">
      <div class="sp-h"><h2 class="h-m">Скоро на сцене</h2><p class="soft">Ближайшие показы спектаклей с участием артиста</p></div>
      <div class="afs-dates sp-dates" id="ar-soon"></div>
    </div>
  </section>

  <section class="sp-sec">
    <div class="wrap">
      <div class="ar-nav"><a id="ar-prev" href="#"></a><a id="ar-next" href="#"></a></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/shows-info.js?v=1"></script>
<script src="assets/app.js?v=5"></script>
<script src="assets/collage.js?v=3" data-root=""></script>
<script>
(function () {
  var H = window.KVH, S = KV.shows, SC = KV.scenes, I = window.KV_INFO || {}, P = window.KV_PEOPLE || [];
  var $ = function (x) { return document.getElementById(x); };
  var id = new URLSearchParams(location.search).get('id');
  var idx = P.map(function (p) { return p[0]; }).indexOf(id); if (idx < 0) idx = 0;
  var p = P[idx], name = p[1];
  document.title = name + ' — Театральный ковчег в Дубраве';
  $('ar-back').href = H.withV('truppa.html');
  $('ar-img').src = 'photos/artists/' + p[0] + '.png'; $('ar-img').alt = name;
  $('ar-k').textContent = p[3] === 'team' ? 'Руководство и режиссёры' : 'Труппа';
  $('ar-t').textContent = name;
  $('ar-role').textContent = p[2];

  /* роли и работы — из составов и списков создателей спектаклей */
  var roles = [], crew = [], shows = [];
  Object.keys(I).forEach(function (k) {
    (I[k].cast || []).forEach(function (c) { if (c[1].indexOf(name) >= 0) { roles.push([k, c[0]]); if (shows.indexOf(k) < 0) shows.push(k); } });
    (I[k].crew || []).forEach(function (c) { if (c[1].indexOf(name) >= 0) { crew.push([k, c[0]]); if (shows.indexOf(k) < 0) shows.push(k); } });
  });
  var all = roles.concat(crew.map(function (c) { return [c[0], c[1], 1]; }));
  if (all.length) {
    $('ar-roles').innerHTML = all.map(function (r) {
      var s = S[r[0]];
      return '<li><a href="' + H.showUrl(r[0]) + '"><span class="ph">' + (s.photo ? '<img src="photos/' + s.photo + '" alt="" loading="lazy">' : '') + '</span><span><b>' + H.esc(s.title) + '</b><small>' + (r[2] ? '' : 'Роль: ') + H.esc(r[1]) + '</small></span></a></li>';
    }).join('');
  } else $('roles-w').style.display = 'none';
  $('ar-facts').innerHTML = all.length ? '<div><dt>Спектаклей в афише</dt><dd>' + shows.length + '</dd></div>' + (roles.length ? '<div><dt>Ролей</dt><dd>' + roles.length + '</dd></div>' : '') : '';

  /* ближайшие показы этих спектаклей */
  var soon = H.upcoming.filter(function (e) { return shows.indexOf(e.show) >= 0; }).slice(0, 8);
  if (soon.length) {
    $('ar-soon').innerHTML = soon.map(function (e) {
      var d = H.pd(e.date), l = '<b>' + d.getDate() + ' ' + H.MG[d.getMonth()].slice(0, 3) + '</b><span>' + H.esc(S[e.show].short || S[e.show].title) + '</span><span>' + H.WS[d.getDay()] + ', ' + e.time + '</span>';
      return e.status === 'sold' ? '<span class="afs-dt sold">' + l + '</span>' : '<button type="button" class="afs-dt" data-buy="' + e.id + '">' + l + '</button>';
    }).join('');
  } else $('soon-w').style.display = 'none';

  /* соседние артисты */
  var a = P[(idx - 1 + P.length) % P.length], b = P[(idx + 1) % P.length];
  $('ar-prev').href = H.artistUrl(a[0]); $('ar-prev').innerHTML = '<small>← Предыдущий</small>' + H.esc(a[1]);
  $('ar-next').href = H.artistUrl(b[0]); $('ar-next').innerHTML = '<small>Следующий →</small>' + H.esc(b[1]);
})();
</script>
<script src="review-notes.js" defer></script>
</body>
</html>
