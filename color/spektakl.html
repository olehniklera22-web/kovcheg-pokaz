<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Спектакль — Театральный ковчег в Дубраве</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Fira+Sans+Extra+Condensed:wght@500;600;700;800&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=6">
<link rel="stylesheet" href="assets/collage.css?v=2">
<link rel="stylesheet" href="assets/main.css?v=27">
<link rel="stylesheet" href="assets/pages.css?v=8">
<link rel="stylesheet" href="assets/color.css?v=1">
</head>
<body data-page="show">
<div id="site-header"></div>
<main id="main">
  <!-- Первый экран, вариант 1: как премьера на главной варианта 1 — текст слева, афиша с рваным краем справа -->
  <section class="m1 hv1" aria-label="Спектакль">
    <div class="wrap">
      <div class="tx">
        <a class="back js-back" href="main-1.html#afisha">← Афиша</a>
        <span class="eyebrow js-k"></span>
        <h1 class="h-xl js-t"></h1>
        <p class="when js-when"></p>
        <div class="acts"><button class="btn btn-buy js-buy" type="button">Купить билет</button><a class="link-arrow" href="#dates">Все даты</a></div>
      </div>
      <div class="pic"><div class="ph"><img class="js-img" alt=""></div><div class="edge" data-strip="31" data-h="38"></div></div>
    </div>
  </section>

  <!-- Первый экран, вариант 2: как «Плёнка» на главной варианта 2 — название по центру, лента кадров спектакля, герой стоит на ленте -->
  <section class="hf hv2" aria-label="Спектакль">
    <div class="wrap">
      <a class="back js-back" href="main-2.html#afisha">← Афиша</a>
      <span class="eyebrow js-k"></span>
      <h1 class="h-xl"><span class="js-t"></span><span class="serif js-tag"></span></h1>
      <p class="lead js-when"></p>
      <div class="acts"><button class="btn btn-buy js-buy" type="button">Купить билет</button><a class="link-arrow" href="#dates">Все даты</a></div>
    </div>
    <div class="film">
      <img class="hero-cut l sp-hcut" id="hv2-cut" alt="" hidden>
      <div class="tear t" data-strip="61" data-h="34" aria-hidden="true"></div>
      <div class="track" id="hv2-track" aria-hidden="true"></div>
      <div class="tear b" data-strip="67" data-h="34" aria-hidden="true"></div>
    </div>
  </section>

  <!-- то, что вынесено с первого экрана: автор, подзаголовок, продолжительность, сцена, режиссёр, премьера -->
  <section class="sp-facts-sec">
    <div class="wrap">
      <div class="sp-fx"><p class="src" id="sp-src"></p><p class="tagline" id="sp-tag"></p></div>
      <dl class="facts" id="sp-facts"></dl>
    </div>
  </section>

  <section class="sp-sec" id="dates">
    <div class="wrap">
      <div class="sp-h"><h2 class="h-m">Ближайшие показы</h2><p class="soft" id="sp-dsum"></p></div>
      <div class="afs-dates sp-dates" id="sp-dates"></div>
    </div>
  </section>

  <section class="sp-sec" id="about">
    <div class="wrap">
      <h2 class="h-m">О спектакле</h2>
      <div class="sp-about" id="sp-about"></div>
    </div>
  </section>

  <section class="sp-sec sp-prog-sec" id="prog-w">
    <div class="wrap">
      <div class="prog">
        <div class="tear t" data-strip="81" data-h="30" aria-hidden="true"></div>
        <div class="sheet">
          <div class="pg-top"><span>Театральный ковчег в Дубраве</span><span>Программа спектакля</span></div>
          <h2 class="pg-t" id="pg-t"></h2>
          <p class="pg-src" id="pg-src"></p>
          <div class="pg-cols">
            <div id="pg-cast-w"><h3>Действующие лица и&nbsp;исполнители</h3><ul class="pg-list" id="pg-cast"></ul></div>
            <div id="pg-crew-w"><h3>Над спектаклем работали</h3><ul class="pg-list crew" id="pg-crew"></ul></div>
          </div>
          <p class="pg-foot" id="pg-foot"></p>
        </div>
        <div class="tear b" data-strip="83" data-h="30" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <section class="sp-sec" id="gal-w">
    <div class="wrap">
      <div class="sp-h"><h2 class="h-m">Фото со сцены</h2><p class="soft" id="sp-gsum"></p></div>
      <div class="sp-gal" id="sp-gal"></div>
    </div>
  </section>

  <section class="sp-sec">
    <div class="wrap">
      <div class="sp-h"><h2 class="h-m">Другие спектакли</h2><a class="link-arrow" id="sp-all" href="main-1.html#afisha">Вся афиша</a></div>
      <div class="sp-more" id="sp-more"></div>
    </div>
  </section>
</main>
<div class="sp-bar" id="sp-bar" aria-hidden="true"><div class="wrap"><span class="t" id="bar-t"></span><span class="w" id="bar-w"></span><button class="btn btn-buy" type="button" id="bar-buy" tabindex="-1">Купить билет</button></div></div>
<dialog class="lb" id="lb" aria-label="Фото со сцены"><button class="x" type="button" aria-label="Закрыть">×</button><button class="nv p" type="button" aria-label="Предыдущее фото">←</button><img id="lb-img" alt=""><button class="nv n" type="button" aria-label="Следующее фото">→</button></dialog>
<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/shows-info.js?v=1"></script>
<script src="assets/app.js?v=5"></script>
<script src="assets/collage.js?v=3" data-root=""></script>
<script>
(function () {
  var H = window.KVH, S = KV.shows, SC = KV.scenes, I = window.KV_INFO || {}, P = window.KV_PEOPLE || [];
  var id = new URLSearchParams(location.search).get('id');
  if (!S[id]) id = 'zoykina';
  var s = S[id], inf = I[id] || {}, home = H.V2 ? 'main-2.html' : 'main-1.html';
  var $ = function (x) { return document.getElementById(x); };
  document.title = s.title + ' — Театральный ковчег в Дубраве';
  $('sp-all').href = home + '#afisha';

  /* первый экран — один и тот же контент, а вид свой у каждого варианта */
  var each = function (cls, f) { document.querySelectorAll('.' + cls).forEach(f); };
  var ev = H.upcoming.filter(function (e) { return e.show === id; });
  var next = ev.filter(function (e) { return e.status === 'sale' || e.status === 'few'; })[0];
  var prem = ev.some(function (e) { return e.prem; });
  function range() {
    if (!ev.length) return '';
    var a = H.pd(ev[0].date), b = H.pd(ev[ev.length - 1].date);
    if (ev.length === 1 || ev[0].date === ev[ev.length - 1].date) return a.getDate() + ' ' + H.MG[a.getMonth()];
    if (a.getMonth() === b.getMonth()) return a.getDate() + '–' + b.getDate() + ' ' + H.MG[a.getMonth()];
    return a.getDate() + ' ' + H.MG[a.getMonth()] + ' — ' + b.getDate() + ' ' + H.MG[b.getMonth()];
  }
  each('js-back', function (x) { x.href = home + '#afisha'; });
  each('js-k', function (x) { x.textContent = (prem ? 'Премьера · ' : '') + s.genre; });
  each('js-t', function (x) { x.textContent = s.title; });
  each('js-tag', function (x) { x.textContent = inf.tag && inf.tag.length < 40 ? inf.tag : (s.author || ''); });
  each('js-when', function (x) { x.textContent = [range(), s.age].filter(Boolean).join(' · '); });
  each('js-img', function (x) { if (s.photo) { x.src = 'photos/' + s.photo; x.alt = 'Афиша спектакля «' + s.title + '»'; } });
  each('js-buy', function (x) { if (next) x.setAttribute('data-buy', next.id); else x.style.display = 'none'; });

  /* лента кадров варианта 2: кадры этого спектакля, мало кадров — повторяем */
  var frames = [];
  for (var g = 1; (inf.gal || 0) > 1 && g <= inf.gal; g++) frames.push('photos/shows/' + id + '/' + (g < 10 ? '0' : '') + g + '.jpg');
  if (s.photo) frames.unshift('photos/' + s.photo);
  if (frames.length < 3) ['iudushka-2', 'zoykina', 'vishnevyy-sad', 'magiya', 'dyadya-vanya', 'revizor', 'olesya', 'garnir'].forEach(function (k) { var u = 'photos/' + k + '.jpg'; if (frames.indexOf(u) < 0) frames.push(u); });
  while (frames.length && frames.length < 8) frames = frames.concat(frames);
  var one = frames.map(function (u) { return '<img src="' + u + '" alt="" loading="lazy">'; }).join('');
  $('hv2-track').innerHTML = one + one;

  /* вынесенное ниже: автор, подзаголовок, факты */
  $('sp-src').textContent = inf.src || s.author || '';
  $('sp-tag').textContent = inf.tag || s.desc || '';
  /* во 2 варианте подзаголовок (или автор) уже стоит в названии курсивом — ниже не повторяем */
  if (H.V2) { if (inf.tag && inf.tag.length < 40) $('sp-tag').style.display = 'none'; else $('sp-src').style.display = 'none'; }
  var scenes = []; ev.forEach(function (e) { if (scenes.indexOf(SC[e.scene]) < 0) scenes.push(SC[e.scene]); });
  var dir = (inf.crew || []).filter(function (c) { return /режисс/i.test(c[0]); })[0];
  var facts = [['Продолжительность', inf.dur], ['Сцена', scenes.join(', ')], ['Режиссёр', dir ? dir[1] : s.dir], ['Премьера', inf.prem], ['Пушкинская карта', s.pk ? 'можно оплатить' : '']];
  $('sp-facts').innerHTML = facts.filter(function (f) { return f[1]; }).map(function (f) { return '<div><dt>' + f[0] + '</dt><dd>' + H.esc(f[1]) + '</dd></div>'; }).join('');

  /* даты — обрывки бумаги, как в афише */
  function rnd(seed) { var x = 0, i = 0; for (; i < seed.length; i++) x = (x * 31 + seed.charCodeAt(i)) % 2147483647; return function () { x = (x * 16807) % 2147483647; return x / 2147483647; }; }
  function torn(k) {
    var r = rnd('t' + k), top = [], bot = [], x;
    for (x = 0; x < 100; x += 7 + r() * 6) top.push(x.toFixed(1) + '% ' + (r() * 7).toFixed(1) + '%');
    top.push('100% ' + (r() * 6).toFixed(1) + '%');
    for (x = 100; x > 0; x -= 7 + r() * 6) bot.push(x.toFixed(1) + '% ' + (93 + r() * 7).toFixed(1) + '%');
    bot.push('0% ' + (94 + r() * 6).toFixed(1) + '%');
    return 'polygon(' + top.concat(bot).join(',') + ')';
  }
  function plural(n, a, b, c) { var x = n % 10, y = n % 100; return x === 1 && y !== 11 ? a : x >= 2 && x <= 4 && (y < 10 || y >= 20) ? b : c; }
  $('sp-dsum').textContent = ev.length ? ev.length + ' ' + plural(ev.length, 'показ', 'показа', 'показов') : '';
  $('sp-dates').className = 'sp-tiles';
  $('sp-dates').innerHTML = ev.length ? ev.map(function (e) {
    var d = H.pd(e.date), we = d.getDay() === 0 || d.getDay() === 6, tilt = ((rnd('r' + e.id)() - .5) * 5).toFixed(1);
    var act = e.status === 'sold' ? '<span class="no">Аншлаг</span>' : e.status === 'group' ? '<button class="afs-btn ghost" type="button" data-buy="' + e.id + '">Заявка</button>' : '<button class="afs-btn" type="button" data-buy="' + e.id + '">Купить</button>';
    return '<div class="tile' + (e.status === 'sold' ? ' sold' : '') + '"><span class="afs-d' + (we ? ' we' : '') + '" style="--r:' + tilt + 'deg"><span class="pp" style="clip-path:' + torn(e.id) + '"><b>' + d.getDate() + '</b> ' + H.MG[d.getMonth()].slice(0, 3) + '<small>' + H.WD[d.getDay()] + '</small></span></span>' +
      '<span class="i"><b>' + e.time + '</b><small>' + SC[e.scene] + (e.status === 'few' ? ' · <em>мало мест</em>' : '') + '</small></span>' + act + '</div>';
  }).join('') : '<p class="soft">Новых показов пока нет — следите за афишей.</p>';

  /* вырезанный герой выходит из афиши — там, где есть вырезка */
  var CUT = { zoykina: 'zoykina-man.png', vishnevy: 'vishnevy-couple.png', volsh: 'volshebnik-heroes.png', magiya: 'magiya-trio.png' };
  if (CUT[id]) { $('hv2-cut').src = 'photos/stage/' + CUT[id]; $('hv2-cut').hidden = false; $('hv2-cut').classList.add('c-' + id); }

  /* о спектакле: первый абзац крупнее */
  var about = (inf.about && inf.about.length ? inf.about : [s.desc]).filter(Boolean).slice();
  var tag = (inf.tag || '').trim();
  if (tag && about[0] && about[0].indexOf(tag) === 0) about[0] = about[0].slice(tag.length).trim();
  about = about.filter(Boolean);
  $('sp-about').innerHTML = about.map(function (p, j) { return '<p' + (j === 0 && p.length < 240 ? ' class="lead1"' : '') + '>' + H.esc(p) + '</p>'; }).join('');
  if (!about.length) $('about').style.display = 'none';

  /* имена артистов — ссылки на их страницы, если человек есть в труппе */
  function person(name) { return P.filter(function (p) { return name.indexOf(p[1]) >= 0; })[0]; }
  function link(names) {
    return names.split(/,\s*/).map(function (n) { var p = person(n); return p ? '<a href="' + H.artistUrl(p[0]) + '">' + H.esc(n) + '</a>' : H.esc(n); }).join(', ');
  }

  /* программка: действующие лица и исполнители, создатели */
  $('pg-t').textContent = s.title;
  $('pg-src').textContent = [inf.src || s.author, s.genre].filter(Boolean).join(' · ');
  var cast = (inf.cast || []).filter(function (c) { return !/^N\.?N\.?$/.test(c[1].trim()); });
  var crew = (inf.crew || []).length ? inf.crew : (s.dir ? [['Режиссёр', s.dir]] : []);
  if (cast.length) $('pg-cast').innerHTML = cast.map(function (c) { return '<li><i>' + H.esc(c[0] || '') + '</i><span class="dots"></span><b>' + link(c[1]) + '</b></li>'; }).join('');
  else $('pg-cast-w').style.display = 'none';
  if (crew.length) $('pg-crew').innerHTML = crew.map(function (c) { return c[0] ? '<li><i>' + H.esc(c[0]) + '</i><span class="dots"></span><b>' + link(c[1]) + '</b></li>' : '<li class="w">' + H.esc(c[1]) + '</li>'; }).join('');
  else $('pg-crew-w').style.display = 'none';
  if (!cast.length && !crew.length) $('prog-w').style.display = 'none';
  if (!cast.length) document.querySelector('.pg-cols').classList.add('one');
  $('pg-foot').textContent = [inf.dur ? 'Продолжительность ' + inf.dur : '', s.age ? 'Возраст ' + s.age : '', inf.prem ? 'Премьера — ' + inf.prem : ''].filter(Boolean).join(' · ');

  /* липкая плашка покупки — когда первый экран ушёл вверх */
  if (next) {
    var nd = H.pd(next.date);
    $('bar-t').textContent = s.title; $('bar-w').textContent = 'Ближайший — ' + nd.getDate() + ' ' + H.MG[nd.getMonth()] + ', ' + H.WS[nd.getDay()] + ', ' + next.time;
    $('bar-buy').setAttribute('data-buy', next.id);
    var bar = $('sp-bar'), hero = document.querySelector(H.V2 ? '.hv2' : '.hv1');
    var was = null;
    function upd() { var on = hero.getBoundingClientRect().bottom < 0; if (on === was) return; was = on; bar.classList.toggle('on', on); bar.setAttribute('aria-hidden', !on); $('bar-buy').tabIndex = on ? 0 : -1; }
    addEventListener('scroll', upd, { passive: true }); upd();
  }

  /* галерея + просмотр */
  var n = inf.gal || 0, pics = [];
  for (var i = 1; i <= n; i++) pics.push('photos/shows/' + id + '/' + (i < 10 ? '0' : '') + i + '.jpg');
  if (pics.length < 2) $('gal-w').style.display = 'none';
  else {
    $('sp-gsum').textContent = pics.length + ' кадров';
    $('sp-gal').innerHTML = pics.map(function (u, j) { return '<button type="button" data-i="' + j + '"><img src="' + u + '" alt="Сцена из спектакля «' + H.esc(s.title) + '», кадр ' + (j + 1) + '" loading="lazy"></button>'; }).join('');
    var lb = $('lb'), cur = 0;
    function show(j) { cur = (j + pics.length) % pics.length; $('lb-img').src = pics[cur]; }
    $('sp-gal').addEventListener('click', function (e) { var b = e.target.closest('[data-i]'); if (b) { show(+b.dataset.i); lb.showModal(); } });
    lb.addEventListener('click', function (e) { if (e.target.closest('.x') || e.target === lb) lb.close(); else if (e.target.closest('.p')) show(cur - 1); else if (e.target.closest('.n')) show(cur + 1); });
    lb.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') show(cur - 1); if (e.key === 'ArrowRight') show(cur + 1); });
  }

  /* другие спектакли — ближайшие по датам */
  var seen = {}, more = [];
  H.upcoming.forEach(function (e) { if (e.show !== id && !seen[e.show] && S[e.show].photo && S[e.show].type !== 'fest' && more.length < 4) { seen[e.show] = 1; more.push(e); } });
  $('sp-more').innerHTML = more.map(function (e) {
    var t = S[e.show], d = H.pd(e.date);
    return '<a class="sp-card" href="' + H.showUrl(e.show) + '"><span class="ph"><img src="photos/' + t.photo + '" alt="" loading="lazy"></span><b>' + H.esc(t.title) + '</b><small>' + d.getDate() + ' ' + H.MG[d.getMonth()] + ' · ' + H.esc(t.genre) + (t.age ? ' · ' + t.age : '') + '</small></a>';
  }).join('');
})();
</script>
<script src="assets/showbar.js?v=1"></script>
</body>
</html>
