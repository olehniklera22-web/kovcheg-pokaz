<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Труппа — Театральный ковчег в Дубраве</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Fira+Sans+Extra+Condensed:wght@500;600;700;800&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=6">
<link rel="stylesheet" href="assets/collage.css?v=2">
<link rel="stylesheet" href="assets/main.css?v=27">
<link rel="stylesheet" href="assets/pages.css?v=8">
<link rel="stylesheet" href="assets/troupe.css?v=2">
</head>
<body data-page="troupe">
<div id="site-header"></div>
<main id="main">
  <!-- Вариант 1: как премьера на главной — текст слева, кадр со сцены с рваным краем справа; ниже сетка портретов -->
  <section class="m1 tv1" aria-label="Труппа">
    <div class="wrap">
      <div class="tx">
        <span class="eyebrow">Труппа театра</span>
        <h1 class="h-xl">Лица театра</h1>
        <p class="when js-count"></p>
        <div class="tr-ctl">
          <div class="tr-tabs js-tabs" role="group" aria-label="Кого показать"></div>
          <label class="tr-find"><span class="sr">Найти по имени</span><input type="search" id="tr-q" placeholder="Найти по фамилии" autocomplete="off"></label>
        </div>
      </div>
      <div class="pic"><div class="ph"><img src="photos/shows/zoykina/05.jpg" alt="Сцена из спектакля «Зойкина квартира»"></div><div class="edge" data-strip="31" data-h="38"></div></div>
    </div>
  </section>
  <section class="tv1 tr-grid-sec">
    <div class="wrap">
      <div class="tr-grid" id="tr-grid"></div>
      <p class="tr-none soft" id="tr-none" hidden>Никого не нашли — проверьте написание.</p>
    </div>
  </section>

  <!-- Вариант 2: как «Плёнка» на главной — название по центру, труппа стоит в ряд на полосе бумаги, как на поклоне; ниже список -->
  <section class="hf tv2" aria-label="Труппа">
    <div class="wrap">
      <span class="eyebrow">Труппа театра</span>
      <h1 class="h-xl">Лица театра<span class="serif">выходят на поклон</span></h1>
      <p class="lead js-count"></p>
      <div class="tr-tabs js-tabs center" role="group" aria-label="Кого показать"></div>
    </div>
    <div class="tr-bow">
      <div class="tear t" data-strip="91" data-h="34" aria-hidden="true"></div>
      <div class="row" id="tr-row"></div>
      <div class="tear b" data-strip="93" data-h="34" aria-hidden="true"></div>
      <button class="tr-arr p" type="button" aria-label="Листать влево">←</button><button class="tr-arr n" type="button" aria-label="Листать вправо">→</button>
    </div>
  </section>
  <section class="tv2 tr-list-sec">
    <div class="wrap">
      <ol class="tr-list" id="tr-list"></ol>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/shows-info.js?v=1"></script>
<script src="assets/app.js?v=5"></script>
<script src="assets/collage.js?v=3" data-root=""></script>
<script>
(function () {
  var H = window.KVH, I = window.KV_INFO || {}, P = (window.KV_PEOPLE || []).slice();
  var $ = function (x) { return document.getElementById(x); };
  /* роли и спектакли каждого — из составов */
  var info = {};
  P.forEach(function (p) {
    var roles = 0, shows = {};
    Object.keys(I).forEach(function (k) {
      (I[k].cast || []).forEach(function (c) { if (c[1].indexOf(p[1]) >= 0) { roles++; shows[k] = 1; } });
      (I[k].crew || []).forEach(function (c) { if (c[1].indexOf(p[1]) >= 0) shows[k] = 1; });
    });
    info[p[0]] = { roles: roles, shows: Object.keys(shows).length };
  });
  /* по алфавиту фамилий; руководство — отдельной группой */
  function last(n) { var a = n.split(' '); return a[a.length - 1]; }
  P.sort(function (a, b) { return last(a[1]).localeCompare(last(b[1]), 'ru'); });
  var nStage = P.filter(function (p) { return p[3] === 'stage'; }).length, nTeam = P.length - nStage;
  function plural(n, a, b, c) { var x = n % 10, y = n % 100; return x === 1 && y !== 11 ? a : x >= 2 && x <= 4 && (y < 10 || y >= 20) ? b : c; }
  document.querySelectorAll('.js-count').forEach(function (x) { x.textContent = nStage + ' ' + plural(nStage, 'актёр', 'актёра', 'актёров') + ' · ' + nTeam + ' в руководстве'; });
  var TABS = [['all', 'Все'], ['stage', 'Актёры'], ['team', 'Руководство и режиссёры']];
  var st = { g: 'all', q: '' };
  function meta(p) {
    var i = info[p[0]], t = [];
    if (i.roles) t.push(i.roles + ' ' + plural(i.roles, 'роль', 'роли', 'ролей'));
    if (i.shows) t.push(i.shows + ' ' + plural(i.shows, 'спектакль', 'спектакля', 'спектаклей'));
    return t.join(' · ');
  }
  function list() {
    var q = st.q.trim().toLowerCase();
    return P.filter(function (p) { return (st.g === 'all' || p[3] === st.g) && (!q || p[1].toLowerCase().indexOf(q) >= 0); });
  }
  function render() {
    document.querySelectorAll('.js-tabs').forEach(function (box) {
      box.innerHTML = TABS.map(function (t) { return '<button type="button" class="afs-chip" data-g="' + t[0] + '" aria-pressed="' + (st.g === t[0]) + '">' + t[1] + '</button>'; }).join('');
    });
    var L = list();
    if (H.V2) {
      $('tr-row').innerHTML = L.map(function (p, j) {
        return '<a class="fig" href="' + H.artistUrl(p[0]) + '" style="--d:' + ((j % 3) * 10) + 'px"><img src="photos/artists/' + p[0] + '.png" alt="" loading="lazy"><span><b>' + H.esc(p[1]) + '</b>' + H.esc(p[2]) + '</span></a>';
      }).join('');
      $('tr-list').innerHTML = L.map(function (p) {
        return '<li><a href="' + H.artistUrl(p[0]) + '"><b>' + H.esc(p[1]) + '</b><span class="dots"></span><i>' + H.esc(p[2]) + '</i></a></li>';
      }).join('');
    } else {
      $('tr-grid').innerHTML = L.map(function (p) {
        return '<a class="pc" href="' + H.artistUrl(p[0]) + '"><span class="ph"><img src="photos/artists/' + p[0] + '.png" alt="" loading="lazy"></span><b>' + H.esc(p[1]) + '</b><small>' + H.esc(p[2]) + '</small>' + (meta(p) ? '<em>' + meta(p) + '</em>' : '') + '</a>';
      }).join('');
      $('tr-none').hidden = L.length > 0;
    }
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.js-tabs [data-g]'); if (b) { st.g = b.dataset.g; render(); return; }
    var a = e.target.closest('.tr-arr'); if (a) { var r = $('tr-row'); r.scrollBy({ left: (a.classList.contains('n') ? 1 : -1) * r.clientWidth * .8, behavior: 'smooth' }); }
  });
  $('tr-q').addEventListener('input', function () { st.q = this.value; render(); });
  render();
})();
</script>
<script src="assets/showbar.js?v=1"></script>
</body>
</html>
