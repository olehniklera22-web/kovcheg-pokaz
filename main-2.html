<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Главная — вариант 2 «По спектаклям» — Театральный ковчег в Дубраве</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Fira+Sans+Extra+Condensed:wght@500;600;700;800&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=3">
<link rel="stylesheet" href="assets/main.css">
</head>
<body data-page="home">
<div id="site-header"></div>
<main id="main">
  <section class="m2" aria-label="Ближайшие показы">
    <div class="wrap">
      <div class="wk">
        <span class="eyebrow">Ближайшие показы</span>
        <h1 class="h-l">Скоро на сцене</h1>
        <ol id="wk"></ol>
        <a class="link-arrow all" href="#afisha">Вся афиша</a>
      </div>
      <div class="fig">
        <div class="strip" data-strip="41" data-h="64"></div>
        <figure><img src="photos/stage/zoykina-man.png" alt="Герой спектакля «Зойкина квартира»"></figure>
        <figcaption>Зойкина квартира<small>28 ноября · комедия · 16+</small></figcaption>
      </div>
    </div>
  </section>

  <section class="afs-sec bg2" id="afisha">
    <div class="wrap">
      <div class="afs-head"><div><span class="eyebrow">Билеты онлайн — круглосуточно</span><h2 class="h-l">Афиша</h2></div><p class="soft" style="max-width:40ch">Каждый спектакль — одна карточка, а в ней все его даты. Нажмите на дату — откроется покупка.</p></div>
      <div id="afs" data-mode="show"></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/collage.js" data-root=""></script>
<script src="assets/afisha-sys.js"></script>
<script>
(function () {
  var H = window.KVH, S = KV.shows, SC = KV.scenes;
  var ev = H.upcoming.filter(function (e) { return (e.status === 'sale' || e.status === 'few') && S[e.show].type !== 'fest'; }).slice(0, 6), cd = '';
  document.getElementById('wk').innerHTML = ev.map(function (e) {
    var s = S[e.show], d = H.pd(e.date), first = e.date !== cd; cd = e.date;
    return '<li><span class="d">' + (first ? '<b>' + d.getDate() + '</b> ' + H.MG[d.getMonth()].slice(0, 3) + '<small>' + H.WD[d.getDay()] + '</small>' : '') + '</span><span class="tm">' + e.time + '</span>' +
      '<span class="ti">' + H.esc(s.short || s.title) + '<small>' + H.esc(s.genre) + (s.age ? ' · ' + s.age : '') + ' · ' + SC[e.scene] + '</small></span>' +
      '<button class="afs-btn" type="button" data-buy="' + e.id + '">Купить</button></li>';
  }).join('');
})();
(function () {
  var bar = document.createElement('nav'); bar.className = 'mbar'; bar.setAttribute('aria-label', 'Варианты главной');
  bar.innerHTML = '<span>Главная</span><a href="main-1.html"' + (2 === 1 ? ' class="on"' : '') + '>1 · По датам</a><a href="main-2.html"' + (2 === 2 ? ' class="on"' : '') + '>2 · По спектаклям</a>';
  document.body.appendChild(bar);
})();
</script>
</body>
</html>
